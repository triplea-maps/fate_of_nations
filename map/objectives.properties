Fate_of_Nations_June_1941.Germany;objectiveAttachment_Germans_Control_Stalingrad_Or_Leningrad_Or_Moscow=<b>German Control of Key Russian Cities</b> 5 PUs for each German controlled territory: Moscow, Leningrad, and Stalingrad.
Fate_of_Nations_June_1941.Germany;objectiveAttachment_Germans_Control_Caucasus=<b>Germans Control of the Caucasus</b> 2 PUs for each German controlled territory: Krasnodar, Grozny-Chechnya, Baku-Azerbaijan, Tbilisi-Georgia.
Fate_of_Nations_June_1941.Germany;objectiveAttachment_Germans_Control_Baghdad_Or_Tehran=<b>Germans Control Iraq or Iran</b> 3 PUs for each German controlled territory: Baghdad and Tehran.
Fate_of_Nations_June_1941.Germany;objectiveAttachment_German_Presence_in_Britain=<b>Operation Sea Lion</b> 5 PUs if Germany controls London, Wales, N.England, Scotland, or N.Ireland.
Fate_of_Nations_June_1941.Germany;objectiveAttachment_German_Vichy_Control_France=<b>German Domination of Vichy France Economic Benefit Transfer</b> 10 PUs if Vichy France controls Vichy-Rhone, Toulouse-Occitania, and Provence-Marseille.
Fate_of_Nations_June_1941.Germany;objectiveAttachment_German_Vichy_Control_North_Africa=<b>Vichy French Control of North Africa Economic Benefit Transfer</b> 3 PUs for each Vichy French controlled territory: Morocco, Oran, Grand Erg, Algiers, Bona, Ouargla, Tunis-Tunisia, and E.Algerian-Sahara.


Fate_of_Nations_June_1941.DanubeAxis;objectiveAttachment_Axis_Control_of_Lviv_Bessarabia_Moldavia=<b>Danube Axis Control Lviv, Bessarabia, and Moldavia</b> 3 PUs.
Fate_of_Nations_June_1941.DanubeAxis;objectiveAttachment_Axis_Control_of_Kiev=<b>Axis Control Kiev</b> 3 PUs.

Fate_of_Nations_June_1941.Finland;objectiveAttachment_Axis_Control_of_Murmansk_Karelia_Vyborg=<b>Finland Controls Murmansk, Karelia, and Vyborg</b> 3 PUs.
Fate_of_Nations_June_1941.Finland;objectiveAttachment_Axis_Control_of_Leningrad=<b>Axis Control Leningrad</b> 3 PUs.

Fate_of_Nations_June_1941.USSR;objectiveAttachment_Archangelsk_Port_Open=<b>Port of Archangelsk (and adjacent sea zone) Open for Lend Lease</b> 2 PUs.
Fate_of_Nations_June_1941.USSR;objectiveAttachment_Tabriz_Open=<b>Tabriz Available for Lend Lease<b> 2 PUs.
Fate_of_Nations_June_1941.USSR;objectiveAttachment_Uelen_Port_Open=<b>Port of Uelen (and adjacent sea zone) Open for Lend Lease</b> 2 PUs.
Fate_of_Nations_June_1941.USSR;objectiveAttachment_USSR_Spread_Communism=<b>Spread of Communism: USSR Controls European Capitals</b> 2 PUs for each Soviet controlled capital: Helsinki, Oslo,Stockholm, Warsaw, Budapest, Bucharest, Sofia, Belgrade, Athens, Ankara, Vienna, Berlin, Rome, Copenhagen, Amsterdam, Brussels, Paris, and Madrid.

Fate_of_Nations_June_1941.Japan;objectiveAttachment_Japanese_Presence_in_Borneo=<b>Japanese Presence on Borneo</b> 3 PUs if Japan contols at least one territory on Borneo.
Fate_of_Nations_June_1941.Japan;objectiveAttachment_Japanese_Presence_in_Sumatra=<b>Japanese Presence on Sumatra</b> 3 PUs if Japan contols at least one territory on Sumatra.
Fate_of_Nations_June_1941.Japan;objectiveAttachment_Japanese_Presence_in_Java=<b>Japanese Presence in Java</b> 2 PUs if Japan contols at least one territory in Java.
Fate_of_Nations_June_1941.Japan;objectiveAttachment_Japanese_Control_Guam_Wake_Midway=<b>Japanese Control American Pacific Outposts</b> 5 PUs if Japan controls Guam, Wake, and Midway.

Fate_of_Nations_June_1941.USA;objectiveAttachment_Control_of_the_Americas=<b>Pan-American Wartime Security</b> 10 PUs if there is no Axis Presence in North America, South America, Carribiean Islands, Hawaii, or in the Sea Zones bordering on the Unite States.
Fate_of_Nations_June_1941.USA;objectiveAttachment_American_Lend_Lease_Delivered_to_Archangelsk=<b>Artic Lend Lease to USSR</b> 3 PUs if American Lend Lease units are in Archangelsk.
Fate_of_Nations_June_1941.USA;objectiveAttachment_American_Lend_Lease_Delivered_to_Tabriz=<b>Persian Lend Lease to USSR</b> 3 PUs if American Lend Lease units are in Tabriz.
Fate_of_Nations_June_1941.USA;objectiveAttachment_American_Lend_Lease_Delivered_to_Uelen=<b>Siberian Lend Lease to USSR</b> 3 PUs if American Lend Lease units are in Uelen.
Fate_of_Nations_June_1941.USA;objectiveAttachment_American_Lend_Lease_Delivered_to_Yunnan=<b>Lend Lease to China</b> 3 PUs if American Lend Lease units are in Yunnan.
Fate_of_Nations_June_1941.USA;objectiveAttachment_American_Lend_Lease_Delivered_to_N.England=<b>Lend Lease to Great Britain</b> 3 PUs if American Lend Lease units are in N.England.
Fate_of_Nations_June_1941.USA;objectiveAttachment_Americans_Fighting_In_North_Africa=<b>Liberation of North Africa</b> 3 PUs if Amrican units are present in North Africa while there is still Axis resistence present.
Fate_of_Nations_June_1941.USA;conditionAttachment_Axis_Resistance_to_Americans_In_Italy=<b>Battle in Italy</b> 3 PUs if Amrican units are present in Italy while there is still Axis resistence present.
Fate_of_Nations_June_1941.USA;objectiveAttachment_Americans_In_Western_Europe=<b>American Presennce in Western Europe</b> 3 PUs if Amrican units are present in France, Belgium, Luxembourg, the Netherlands, Austria, or Germany.

Fate_of_Nations_June_1941.China;objectiveAttachment_Chinese_Burma_Road=<b>Burma Road is Opeen</b> 3 PUs if the Allies control Calcutta, N.Burma, Yunnan, and Chungking.

Fate_of_Nations_June_1941.UK;objectiveAttachment_Bristish_Control_Mediterranean_Access=<b>British control access to the Mediterranean Sea</b> 3 PUs if the British control Gibralter, Cairo, and Sinai.
Fate_of_Nations_June_1941.UK;objectiveAttachment_British_Dutch_Control_of_Sumatra=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 2 PUs ecomonic benefit transfer to the UK if the Dutch still control all of its Sumatra territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.UK;objectiveAttachment_British_Dutch_Control_of_Borneo=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 2 PUs ecomonic benefit transfer to the UK if the Dutch still control all of its Borneo territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.UK;objectiveAttachment_British_Dutch_Control_of_Java=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 2 PUs ecomonic benefit transfer to the UK if the Dutch still control all of its Java territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.UK;objectiveAttachment_British_Dutch_Control_of_Celebs=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 2 PUs ecomonic benefit transfer to the UK if the Dutch still control all of its Celebs territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.UK;objectiveAttachment_British_Dutch_Control_of_New_Guinea=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 2 PUs ecomonic benefit transfer to the UK if the Dutch still control all of its New Guinea territories while the Netherlands are still occupied by the Axis.

Fate_of_Nations_June_1941.BritishIndia;objectiveAttachment_Indian_Dutch_Control_of_Sumatra=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU eecomonic benefit transfer to British India if the Dutch still control all of its Sumatra territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.BritishIndia;objectiveAttachment_Indian_Dutch_Control_of_Borneo=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to British India if the Dutch still control all of its Borneo territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.BritishIndia;objectiveAttachment_Indian_Dutch_Control_of_Java=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to British India if the Dutch still control all of its Java territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.BritishIndia;objectiveAttachment_Indian_Dutch_Control_of_Celebs=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to British India if the Dutch still control all of its Celebs territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.BritishIndia;objectiveAttachment_Indian_Dutch_Control_of_New_Guinea=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to British India if the Dutch still control all of its New Guinea territories while the Netherlands are still occupied by the Axis.

Fate_of_Nations_June_1941.Australia;objectiveAttachment_Clear_Convoy_Lane_Between_Australia_and_USA=<b>Australian-American Convoy Lane Clear</b> 2 PUs if no enemy presence in Sea Zones 054, 049, 030 A, 026 A, 012, and 010 A.
Fate_of_Nations_June_1941.Australia;objectiveAttachment_Australian_Dutch_Control_of_Sumatra=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to Australia if the Dutch still control all of its Sumatra territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.Australia;objectiveAttachment_Australian_Dutch_Control_of_Borneo=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to Australia if the Dutch still control all of its Borneo territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.Australia;objectiveAttachment_Australian_Dutch_Control_of_Java=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to Australia if the Dutch still control all of its Java territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.Australia;objectiveAttachment_Australian_Dutch_Control_of_Celebs=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to Australia if the Dutch still control all of its Celebs territories while the Netherlands are still occupied by the Axis.
Fate_of_Nations_June_1941.Australia;objectiveAttachment_Australian_Dutch_Control_of_New_Guinea=<b>Dutch East Indies: Dutch colonial control of Sumatra</b> 1 PU ecomonic benefit transfer to Australia if the Dutch still control all of its New Guinea territories while the Netherlands are still occupied by the Axis.

Fate_of_Nations_June_1941.Italy;objectiveAttachment_Italians_Control_The_Mediterranean=<b>Italian Control of the Mediterranean Sea</b> 5 PUs if no Allies surface ships are in the Mediterranean Sea.
Fate_of_Nations_June_1941.Italy;objectiveAttachment_Italians_Control_Mediterranean_Islands=<b>Axis Control of the Mediterranean Islands</b> 5 PUs if the Axis control Malta, Crete, and Cyprus.
Fate_of_Nations_June_1941.Italy;objectiveAttachment_Italians_Recreate_Roman_Empire=<b>Italian Recreation of the Roman Empire</b> 5 PUs if Italy controls Athens, Cairo, and Gibraltar.
